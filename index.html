import { getDatabase, ref, set, get, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  messagingSenderId: "922607657180",

};

// ✅ ĐỔI PATH MỚI HOÀN TOÀN — KHÔNG DÙNG DATA CŨ
const DB_PATH = "mrphuc_new_v1", SESSION_KEY = "mrphuc_admin_session";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const THEMES = [
  { id:'red', name:'Đỏ', main:'#ff2a2a', dark:'#c00000', rgb:'255,42,42' },
  { id:'green', name:'Xanh lá', main:'#00c853', dark:'#00a844', rgb:'0,200,83' },

  { id:'orange', name:'Cam', main:'#ff6b35', dark:'#d94a1a', rgb:'255,107,53' },
  { id:'pink', name:'Hồng', main:'#ec4899', dark:'#be185d', rgb:'236,72,153' },
  { id:'gold', name:'Vàng', main:'#ffd700', dark:'#d4a900', rgb:'255,215,0' },
  { id:'cyan', name:'Xanh ngọc', main:'#06b6d4', dark:'#0891b2', rgb:'6,182,212' },
];
const BG_COLORS = ['#000000','#0a0e17','#131826','#1a0033','#001a33','#1a0000','#0a1a00','#2a1a00','#1a002a','#0f0f0f','#ffffff','#f0f0f0','#e0e8f0','#ffe0e0','#e0ffe0'];
const ICONS = [
  { e:'📘', c:'facebook' },{ e:'💌', c:'messenger' },{ e:'🎵', c:'tiktok' },
  { e:'💬', c:'zalo' },{ e:'👥', c:'group' },{ e:'✈️', c:'telegram' },
  { e:'🎮', c:'discord' },{ e:'📧', c:'gmail' },{ e:'▶️', c:'youtube' },

// ✅ MẶC ĐỊNH HOÀN TOÀN TRỐNG
let settings = {
  name:"Mr.Phuc", tagline:"★ HACKER - CRACKER ★",
  desc:"Chào bạn! Mình là Mr.Phuc — chuyên về các dịch vụ công nghệ, script, tool. Liên hệ mình qua các kênh bên dưới nhé!",
  logo:"", music:"", theme:"red", bgType:"stars", bgValue:"",
  bgSize:"cover", bgPosX:"center", bgPosY:"center", bgZoom:100,
  logoSize:130, logoPosX:50, logoPosY:50,
  voiceText:"", voiceRate:1, voicePitch:1, voiceGender:"female", voiceLoop:false, voiceEnabled:false,
  adminUser:"phuc", adminPass:"phc51580",
  links:[]
};
let logoClickCount = 0, clickTimer = null, currentTab = 'info';

window.notif = (msg, err=false) => {
  const el = document.createElement('div');
  el.className = 'notif' + (err?' error':'');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2500);
};
window.closeModal = (id) => document.getElementById(id).classList.remove('show');

onValue(ref(db, DB_PATH + '/settings'), (snap) => {
  const d = snap.val();
  if (d) settings = { ...settings, ...d };
  applyTheme(settings.theme || 'red');
  applyBackground();
  applyLogoStyle();
  render();
});

onValue(ref(db, DB_PATH + '/links'), (snap) => {
  const d = snap.val();
  if (d) settings.links = Object.entries(d).map(([id, l]) => ({ id, ...l })).sort((a,b) => (a.order||0) - (b.order||0));
  else settings.links = [];
  renderLinks();
  if (currentTab === 'links' && document.getElementById('adminModal').classList.contains('show')) renderTabContent();
});

function applyTheme(themeId){
  const t = THEMES.find(x => x.id === themeId) || THEMES[0];
  const root = document.documentElement;
  root.style.setProperty('--main', t.main);
  root.style.setProperty('--main-dark', t.dark);
  root.style.setProperty('--main-rgb', t.rgb);
  root.style.setProperty('--main-soft', `rgba(${t.rgb},.15)`);
  root.style.setProperty('--main-glow', `rgba(${t.rgb},.5)`);
}

function applyBackground(){
  const body = document.body;
  body.classList.remove('bg-hidden');
  if (settings.bgType === 'image' && settings.bgValue) {
    const sz = settings.bgSize === 'cover' ? 'cover' : settings.bgSize === 'contain' ? 'contain' : 'auto';
    body.style.background = `url('${settings.bgValue}')`;
    body.style.backgroundSize = sz;
    body.style.backgroundPosition = `${settings.bgPosX} ${settings.bgPosY}`;
    body.style.backgroundRepeat = 'no-repeat';
    body.style.backgroundAttachment = 'fixed';
    if (settings.bgZoom !== 100 && settings.bgSize !== 'contain') body.style.backgroundSize = `${settings.bgZoom}%`;
    body.classList.add('bg-hidden');
  } else if (settings.bgType === 'color' && settings.bgValue) {
    body.style.background = settings.bgValue;
    body.style.backgroundSize = '';
    body.style.backgroundPosition = '';
    body.style.backgroundAttachment = '';
    body.classList.add('bg-hidden');
  } else {
    body.style.background = '#000';
    body.style.backgroundSize = '';
    body.style.backgroundPosition = '';
    body.style.backgroundAttachment = '';
  }
}

function applyLogoStyle(){
  const root = document.documentElement;
  root.style.setProperty('--logo-size', (settings.logoSize || 130) + 'px');
  const li = document.getElementById('logoImg');
  if (li) li.style.objectPosition = `${settings.logoPosX || 50}% ${settings.logoPosY || 50}%`;
}

function render(){
  document.getElementById('displayName').textContent = settings.name || 'Mr.Phuc';
  document.getElementById('displayTagline').textContent = settings.tagline || '';
  document.getElementById('displayDesc').textContent = settings.desc || '';
  document.title = settings.name || 'Mr.Phuc';
  const li = document.getElementById('logoImg');
  const lp = document.getElementById('logoPh');
  if (settings.logo) { li.src = settings.logo; li.style.display = 'block'; lp.style.display = 'none'; }

function renderLinks(){

function getIconClass(type){

window.saveAdminAccount = async () => {
  const newUser = document.getElementById('newAdminUser').value.trim();
  const oldPass = document.getElementById('oldAdminPass').value;
  const newPass = document.getElementById('newAdminPass').value;
  const confPass = document.getElementById('confirmAdminPass').value;
  const validPass = settings.adminPass || DEFAULT_ADMIN_PASS;
  if (oldPass !== validPass) return window.notif('Mật khẩu cũ không đúng!', true);
  if (!newUser) return window.notif('Nhập tên đăng nhập mới', true);
  if (!newPass) return window.notif('Nhập mật khẩu mới', true);
  if (newPass.length < 4) return window.notif('Mật khẩu tối thiểu 4 ký tự', true);
  if (newPass !== confPass) return window.notif('Mật khẩu nhập lại không khớp!', true);
  await update(ref(db, DB_PATH + '/settings'), { adminUser: newUser, adminPass: newPass });
  settings.adminUser = newUser;
  settings.adminPass = newPass;
  window.notif('✅ Đã đổi tài khoản Admin!');
  renderTabContent();
};

  if (!confirm('Reset về tài khoản mặc định (phuc / phc51580)?')) return;
  await update(ref(db, DB_PATH + '/settings'), { adminUser: DEFAULT_ADMIN_USER, adminPass: DEFAULT_ADMIN_PASS });

};

// VOICE
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => { voiceVoices = speechSynthesis.getVoices(); pickBestVoice(); };
  setTimeout(() => { voiceVoices = speechSynthesis.getVoices(); pickBestVoice(); }, 500);
}
function pickBestVoice(){
  if (!voiceVoices.length) return;
  const gender = settings.voiceGender || 'female';
  const viVoices = voiceVoices.filter(v => v.lang.includes('vi') || v.lang.includes('VI'));
  let pick = null;
  if (gender === 'female') { pick = viVoices.find(v => /female|nữ|woman|linh|mai|vy/i.test(v.name)); if (!pick) pick = viVoices[0]; }
  else { pick = viVoices.find(v => /male|nam|man|hùng|dũng/i.test(v.name)); if (!pick) pick = viVoices[viVoices.length - 1] || viVoices[0]; }
  selectedVoice = pick || viVoices[0] || voiceVoices[0] || null;
}
window.setVoiceGender = async (g) => { settings.voiceGender = g; pickBestVoice(); await update(ref(db, DB_PATH + '/settings'), { voiceGender: g }); renderTabContent(); window.notif(`Đã chọn giọng ${g === 'female' ? 'Nữ' : 'Nam'}`); };
window.changeVoiceRate = async (v) => { settings.voiceRate = parseFloat(v); document.getElementById('rateVal').textContent = v; await update(ref(db, DB_PATH + '/settings'), { voiceRate: settings.voiceRate }); };
window.changeVoicePitch = async (v) => { settings.voicePitch = parseFloat(v); document.getElementById('pitchVal').textContent = v; await update(ref(db, DB_PATH + '/settings'), { voicePitch: settings.voicePitch }); };
window.setVoiceLoop = async (mode) => { settings.voiceLoop = (mode === 'loop'); await update(ref(db, DB_PATH + '/settings'), { voiceLoop: settings.voiceLoop }); renderTabContent(); };
window.saveVoice = async () => { const txt = document.getElementById('voiceText').value.trim(); settings.voiceText = txt; settings.voiceEnabled = !!txt; await update(ref(db, DB_PATH + '/settings'), { voiceText: txt, voiceEnabled: !!txt }); window.notif('✅ Đã lưu giọng đọc!'); };
window.testVoice = () => { const txt = document.getElementById('voiceText').value.trim(); if (!txt) return window.notif('Nhập câu trước!', true); speakText(txt, false); };

function speakText(txt, isLoop) {
  if (!('speechSynthesis' in window)) return window.notif('Trình duyệt không hỗ trợ!', true);
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'vi-VN'; u.rate = settings.voiceRate || 1; u.pitch = settings.voicePitch || 1;
  if (selectedVoice) u.voice = selectedVoice;
  u.onstart = () => { voiceSpeaking = true; document.getElementById('musicBtn').textContent = '🗣️'; const pv = document.getElementById('voicePreviewBox'); if (pv) { pv.style.display = 'block'; document.getElementById('voicePreviewText').textContent = txt; } };
  u.onend = () => { voiceSpeaking = false; if (isLoop && settings.voiceLoop) setTimeout(() => speakText(txt, true), 2000); else { document.getElementById('musicBtn').textContent = '🔇'; const pv = document.getElementById('voicePreviewBox'); if (pv) pv.style.display = 'none'; } };
  speechSynthesis.speak(u);
}
window.stopVoice = () => { if ('speechSynthesis' in window) speechSynthesis.cancel(); voiceSpeaking = false; document.getElementById('musicBtn').textContent = '🔇'; };

window.setBgType = async (type) => { settings.bgType = type; if (type === 'stars') settings.bgValue = ''; await update(ref(db, DB_PATH + '/settings'), { bgType: type, bgValue: settings.bgValue }); applyBackground(); renderTabContent(); window.notif('Đã đổi kiểu nền!'); };
window.setBgColor = async (col) => { settings.bgType = 'color'; settings.bgValue = col; await update(ref(db, DB_PATH + '/settings'), { bgType: 'color', bgValue: col }); applyBackground(); renderTabContent(); window.notif('🎨 Đã đổi màu nền!'); };
window.saveBgUrl = async () => { const url = document.getElementById('bgUrl').value.trim(); if (!url) return window.notif('Nhập link ảnh', true); settings.bgType = 'image'; settings.bgValue = url; await update(ref(db, DB_PATH + '/settings'), { bgType: 'image', bgValue: url }); applyBackground(); renderTabContent(); window.notif('✅ Đã lưu ảnh nền!'); };
window.uploadBg = async (inp) => { const f = inp.files[0]; if (!f) return; window.notif('⏳ Đang tải ảnh...'); try { const url = await uploadToImgBB(f); settings.bgType = 'image'; settings.bgValue = url; await update(ref(db, DB_PATH + '/settings'), { bgType: 'image', bgValue: url }); applyBackground(); renderTabContent(); window.notif('✅ Đã up ảnh nền!'); } catch(e) { window.notif('Lỗi: ' + e.message, true); } };
window.resetBg = async () => { if (!confirm('Reset nền về mặc định?')) return; settings.bgType = 'stars'; settings.bgValue = ''; settings.bgSize = 'cover'; settings.bgPosX = 'center'; settings.bgPosY = 'center'; settings.bgZoom = 100; await update(ref(db, DB_PATH + '/settings'), settings); applyBackground(); renderTabContent(); window.notif('Đã reset nền'); };
window.pickTheme = async (themeId) => { settings.theme = themeId; applyTheme(themeId); await update(ref(db, DB_PATH + '/settings'), { theme: themeId }); window.notif('🎨 Đã đổi màu!'); renderTabContent(); };
window.saveInfo = async () => { const name = document.getElementById('setName').value.trim(); const tagline = document.getElementById('setTagline').value.trim(); const desc = document.getElementById('setDesc').value.trim(); if (!name) return window.notif('Nhập tên', true); await update(ref(db, DB_PATH + '/settings'), { name, tagline, desc }); settings.name = name; settings.tagline = tagline; settings.desc = desc; window.notif('Đã lưu!'); render(); };

async function uploadToImgBB(file){
  const fd = new FormData(); fd.append('image', file);
  const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method:'POST', body:fd });
  const d = await r.json();
  if (d.success) return d.data.url;
  throw new Error('Lỗi upload');
}

window.uploadLogo = async (inp) => { const f = inp.files[0]; if (!f) return; window.notif('⏳ Đang tải...'); try { const url = await uploadToImgBB(f); await update(ref(db, DB_PATH + '/settings'), { logo: url }); settings.logo = url; render(); renderTabContent(); window.notif('✅ Đã đổi logo!'); } catch(e) { window.notif('Lỗi: ' + e.message, true); } };
window.saveLogoUrl = async () => { const url = document.getElementById('logoUrl').value.trim(); await update(ref(db, DB_PATH + '/settings'), { logo: url }); settings.logo = url; render(); renderTabContent(); window.notif('Đã lưu!'); };
window.removeLogo = async () => { if (!confirm('Xóa logo?')) return; await update(ref(db, DB_PATH + '/settings'), { logo: '' }); settings.logo = ''; render(); renderTabContent(); window.notif('Đã xóa'); };
window.onLinkTypeChange = () => { const t = document.getElementById('linkType').value; selectedIcon = TYPE_ICON[t] || '🔗'; selectedIconColor = t === 'zalo-group' ? 'group' : t; renderIconPicker(); };

function renderIconPicker(){
  const c = document.getElementById('iconPicker');
  if (!c) return;
  c.innerHTML = ICONS.map(i => `<button onclick="pickIcon('${i.e}','${i.c}')" class="${selectedIcon===i.e?'selected':''}">${i.e}</button>`).join('');
}
window.pickIcon = (emoji, color) => { selectedIcon = emoji; selectedIconColor = color; document.getElementById('linkCustomIcon').value = ''; renderIconPicker(); };
window.selectCustomIcon = (val) => { if (val.trim()) { selectedIcon = val.trim(); selectedIconColor = 'custom'; renderIconPicker(); } };

window.openLinkEdit = (id) => {
  editingLinkId = id;
  if (id) {
    const l = settings.links.find(x => x.id === id);
    document.getElementById('linkEditTitle').textContent = '✏️ Sửa link';
    document.getElementById('linkType').value = l.type || 'link';
    document.getElementById('linkName').value = l.name || '';
    document.getElementById('linkUrl').value = l.url || '';
    selectedIcon = l.icon || '🔗'; selectedIconColor = l.iconColor || l.type;
    document.getElementById('linkCustomIcon').value = '';
  } else {
    document.getElementById('linkEditTitle').textContent = '➕ Thêm link';
    document.getElementById('linkType').value = 'facebook';
    document.getElementById('linkName').value = '';
    document.getElementById('linkUrl').value = '';
    selectedIcon = '📘'; selectedIconColor = 'facebook';
    document.getElementById('linkCustomIcon').value = '';
  }
  renderIconPicker();
  document.getElementById('linkEditModal').classList.add('show');
};

window.saveLink = async () => {
  const type = document.getElementById('linkType').value;
  const name = document.getElementById('linkName').value.trim();
  let url = document.getElementById('linkUrl').value.trim();
  if (!name || !url) return window.notif('Nhập đủ tên và link', true);
  const phoneClean = url.replace(/[^0-9+]/g, '');
  const isPhoneInput = /^[0-9+\s]+$/.test(url);
  if (type === 'phone') { if (!url.startsWith('tel:')) url = 'tel:' + phoneClean; }
  else if (type === 'zalo' || type === 'zalo-group') {
    if (url.startsWith('tel:')) url = url.replace('tel:', '');
    if (isPhoneInput || /^[0-9+\s]+$/.test(url)) url = 'https://zalo.me/' + url.replace(/\s/g, '');
    else if (!url.startsWith('http')) url = 'https://' + url;
  } else if (type === 'gmail') { if (!url.startsWith('mailto:') && !url.startsWith('http')) url = 'mailto:' + url; }
  else { if (!url.startsWith('http') && !url.startsWith('mailto:') && !url.startsWith('tel:')) url = 'https://' + url; }
  const icon = selectedIcon || TYPE_ICON[type] || '🔗';
  const iconColor = selectedIconColor || type;
  if (editingLinkId) { await update(ref(db, DB_PATH + '/links/' + editingLinkId), { type, name, url, icon, iconColor }); window.notif('✅ Đã sửa!'); }
  else { await push(ref(db, DB_PATH + '/links'), { type, name, url, icon, iconColor, order: Date.now() }); window.notif('✅ Đã thêm!'); }
  closeModal('linkEditModal');
  setTimeout(() => renderTabContent(), 400);
};

window.deleteLink = async (id) => { if (!confirm('Xóa link này?')) return; await remove(ref(db, DB_PATH + '/links/' + id)); window.notif('Đã xóa'); setTimeout(() => renderTabContent(), 400); };
window.saveMusic = async () => { const url = document.getElementById('musicUrl').value.trim(); await update(ref(db, DB_PATH + '/settings'), { music: url }); settings.music = url; window.notif('Đã lưu nhạc!'); renderTabContent(); };
window.removeMusic = async () => { if (!confirm('Xóa nhạc?')) return; await update(ref(db, DB_PATH + '/settings'), { music: '' }); settings.music = ''; window.notif('Đã xóa'); renderTabContent(); };

const audio = new Audio(); audio.loop = true;
window.toggleMusic = () => {
  const btn = document.getElementById('musicBtn');
  if (settings.voiceText && settings.voiceEnabled) { if (voiceSpeaking) { stopVoice(); return; } speakText(settings.voiceText, settings.voiceLoop); return; }
  if (!settings.music) return window.notif('Chưa có nhạc!', true);
  if (musicPlaying) { audio.pause(); musicPlaying = false; btn.textContent = '🔇'; btn.classList.remove('playing'); }
  else { audio.src = settings.music; audio.play().then(() => { musicPlaying = true; btn.textContent = '🔊'; btn.classList.add('playing'); }).catch(e => window.notif('Lỗi nhạc: ' + e.message, true)); }
};

render();
renderIconPicker();
</script>
</body>
</html>
