<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr.Phuc</title>
<style>
:root{--m:#ff2a2a;--md:#c00000;--ms:rgba(255,42,42,.15);--mg:rgba(255,42,42,.5);--ls:130px}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{min-height:100vh;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed}
body.hide-stars #stars{display:none}
#stars{position:fixed;inset:0;z-index:0;background-color:#000;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 60% 70%,#fff,transparent),radial-gradient(1px 1px at 50% 50%,#fff,transparent),radial-gradient(1px 1px at 80% 10%,#fff,transparent),radial-gradient(2px 2px at 90% 60%,#fff,transparent)}
.card{position:relative;z-index:1;width:100%;max-width:380px;background:rgba(10,10,18,.88);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(30px);border-radius:24px;padding:30px 22px 26px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.8)}
.logo{width:var(--ls);height:var(--ls);margin:0 auto 16px;border-radius:50%;overflow:hidden;cursor:pointer;border:3px solid var(--m);box-shadow:0 0 30px var(--mg);background:linear-gradient(135deg,#1a0000,#4a0000)}
.logo img{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.logo .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--ls) * 0.5);font-weight:900;color:var(--m)}
.name{font-size:26px;font-weight:900;color:var(--m);text-shadow:0 2px 12px rgba(0,0,0,.8);margin-bottom:6px}
.tag{font-size:12px;color:var(--m);opacity:.85;margin-bottom:14px;letter-spacing:2px;font-weight:600}
.desc{font-size:13px;color:#d0d0e0;line-height:1.6;margin-bottom:22px;padding:0 6px;font-weight:500}
.links{display:flex;flex-direction:column;gap:10px}
.lb{display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);border-radius:14px;color:#fff;text-decoration:none;font-size:14px;font-weight:700}
.lb:hover{background:var(--ms);border-color:var(--m)}
.lb .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.lb .tx{flex:1;text-align:left}
.lb .ar{color:#888}
.ic-facebook{background:linear-gradient(135deg,#1877f2,#0c5dc7)}
.ic-messenger{background:linear-gradient(135deg,#0084ff,#00c6ff)}
.ic-tiktok{background:linear-gradient(135deg,#000,#25f4ee,#fe2c55)}
.ic-zalo{background:linear-gradient(135deg,#0068ff,#0084ff)}
.ic-phone{background:linear-gradient(135deg,#00c853,#00a844)}
.ic-telegram{background:linear-gradient(135deg,#0088cc,#00aaff)}
.ic-discord{background:linear-gradient(135deg,#5865f2,#4752c4)}
.ic-gmail{background:linear-gradient(135deg,#ea4335,#c5221f)}
.ic-youtube{background:linear-gradient(135deg,#ff0000,#cc0000)}
.ic-instagram{background:linear-gradient(135deg,#e1306c,#fd1d1d,#fcb045)}
.ic-twitter{background:linear-gradient(135deg,#1da1f2,#0c85d0)}
.ic-group{background:linear-gradient(135deg,#00c853,#00a844)}
.ic-custom{background:linear-gradient(135deg,var(--m),var(--md))}
.ic-link{background:linear-gradient(135deg,#888,#555)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:999;padding:15px}
.mbg.show{display:flex}
.mod{background:#131320;border:1px solid var(--ms);border-radius:18px;padding:24px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto}
.mod h2{color:var(--m);font-size:20px;margin-bottom:16px;font-weight:800;text-align:center}
.mod input,.mod textarea,.mod select{width:100%;padding:12px;background:#0a0a14;border:1.5px solid #2a2a3a;border-radius:10px;color:#fff;font-size:14px;margin-bottom:10px}
.mod textarea{min-height:70px;resize:vertical}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--m),var(--md));color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;margin-top:5px}
.bs{background:#2a2a3a}
.bd{background:linear-gradient(135deg,#ef4444,#dc2626)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:8px 10px;background:#1a1a2a;color:#fff;border:1px solid #2a2a3a;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600}
.tabs button.active{background:linear-gradient(135deg,var(--m),var(--md));border-color:var(--m)}
.lr{background:#0a0a14;padding:12px;border-radius:10px;margin-bottom:10px;border-left:3px solid var(--m)}
.lr h4{font-size:13px;color:var(--m);margin-bottom:5px}
.lr p{font-size:12px;color:#888;word-break:break-all;margin-bottom:6px}
.lr button{padding:5px 10px;font-size:11px;border:none;border-radius:6px;cursor:pointer;font-weight:700;color:#fff;margin-right:5px}
.ub{background:#0a0a14;color:#fff;padding:12px;border-radius:10px;text-align:center;cursor:pointer;margin-bottom:12px;font-size:14px;border:2px dashed var(--m);font-weight:600}
.pv{width:100px;height:100px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:block;border:2px solid var(--m)}
.ntf{position:fixed;top:20px;right:20px;background:#00c853;color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;font-size:13px;z-index:9999;max-width:280px}
.ntf.err{background:#ef4444}
.mbtn{position:fixed;top:20px;left:20px;width:44px;height:44px;border-radius:50%;background:var(--ms);border:2px solid var(--m);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:100}
.ip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.ip button{padding:8px;background:#0a0a14;border:1.5px solid #2a2a3a;border-radius:8px;cursor:pointer;font-size:20px}
.ip button.sel{border-color:var(--m);background:var(--ms)}
.lgr{display:flex;gap:6px;margin-top:12px}
.lgr button{flex:1}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.ci{aspect-ratio:1/1;border-radius:14px;cursor:pointer;border:3px solid transparent;position:relative;display:flex;align-items:center;justify-content:center}
.ci.sel{border-color:#fff}
.ci .lbl{position:absolute;bottom:6px;left:0;right:0;font-size:10px;text-align:center;color:#fff;font-weight:700}
.bgg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.bgi{aspect-ratio:1/1;border-radius:10px;cursor:pointer;border:3px solid transparent}
.bgi.sel{border-color:#fff}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pg button{padding:12px;background:#0a0a14;border:1.5px solid #2a2a3a;border-radius:8px;cursor:pointer;font-size:11px;color:#fff;font-weight:600}
.pg button.sel{border-color:var(--m);background:var(--ms);color:var(--m)}
input[type=range]{width:100%;margin:8px 0 14px;accent-color:var(--m)}
.sl{display:flex;justify-content:space-between;font-size:12px;color:#aaa;margin-bottom:4px}
.ib{background:#0a0a14;padding:12px;border-radius:10px;border-left:3px solid var(--m);margin-bottom:12px}
.ib p{font-size:12px;color:#aaa;margin-bottom:4px}
.ib b{color:var(--m)}
</style>
</head>
<body>
<div id="stars"></div>
<div class="mbtn" id="musicBtn" onclick="toggleMusic()">🔇</div>

<div class="card">
  <div class="logo" id="logoWrap" onclick="countClick()">
    <div class="ph" id="logoPh">P</div>
    <img id="logoImg" style="display:none">
  </div>
  <div class="name" id="dName">Mr.Phuc</div>
  <div class="tag" id="dTag">★ HACKER - CRACKER ★</div>
  <div class="desc" id="dDesc">Chào bạn! Mình là Mr.Phuc — chuyên về các dịch vụ công nghệ, script, tool. Liên hệ mình qua các kênh bên dưới nhé!</div>
  <div class="links" id="linkC"></div>
</div>

<!-- LOGIN ADMIN -->
<div class="mbg" id="loginMod"><div class="mod">
<h2>🔐 Đăng nhập Admin</h2>
<input id="aUser" placeholder="Tên đăng nhập">
<input id="aPass" type="password" placeholder="Mật khẩu">
<button class="btn" onclick="doLogin()">Đăng nhập</button>
<button class="btn bs" onclick="closeM('loginMod')">Hủy</button>
</div></div>

<!-- ADMIN PANEL -->
<div class="mbg" id="adminMod"><div class="mod" style="max-width:500px">
<h2>⚙️ Admin Panel</h2>
<div class="tabs">
<button onclick="showTab('info')" id="tbInfo" class="active">📝 TT</button>
<button onclick="showTab('logo')" id="tbLogo">🖼️ Logo</button>
<button onclick="showTab('color')" id="tbColor">🎨 Màu</button>
<button onclick="showTab('bg')" id="tbBg">🌄 Nền</button>
<button onclick="showTab('link')" id="tbLink">🔗 Link</button>
<button onclick="showTab('music')" id="tbMusic">🎵 Nhạc</button>
<button onclick="showTab('voice')" id="tbVoice">🔊 Giọng</button>
<button onclick="showTab('acc')" id="tbAcc">🔑 Admin</button>
</div>
<div id="tabC"></div>
<div class="lgr">
<button class="btn bd" onclick="logout()">🚪 Đăng xuất</button>
<button class="btn bs" onclick="closeM('adminMod')">Đóng</button>
</div>
</div></div>

<!-- LINK EDIT -->
<div class="mbg" id="linkMod"><div class="mod">
<h2 id="linkTitle">✏️ Sửa link</h2>
<select id="lkType" onchange="onTypeChange()">
<option value="facebook">📘 Facebook</option>
<option value="messenger">💌 Messenger</option>
<option value="tiktok">🎵 TikTok</option>
<option value="zalo">💬 Zalo cá nhân</option>
<option value="zalo-group">👥 Nhóm Zalo</option>
<option value="telegram">✈️ Telegram</option>
<option value="discord">🎮 Discord</option>
<option value="gmail">📧 Gmail</option>
<option value="youtube">▶️ YouTube</option>
<option value="instagram">📷 Instagram</option>
<option value="twitter">🐦 Twitter</option>
<option value="phone">📞 SĐT</option>
<option value="custom">⭐ Tùy chỉnh</option>
<option value="link">🔗 Link khác</option>
</select>
<input id="lkName" placeholder="Tên hiển thị">
<input id="lkUrl" placeholder="Link (SĐT/Zalo chỉ nhập số)">
<div class="ip" id="iconP"></div>
<input id="lkCustom" placeholder="Hoặc nhập emoji (VD: 🔥)" oninput="selCustom(this.value)">
<button class="btn" onclick="saveLink()">💾 Lưu</button>
<button class="btn bs" onclick="closeM('linkMod')">Hủy</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const cfg = {
  apiKey: "AIzaSyAOKxix32T2rC9_TrF9mk6socuR0YCcVno",
  authDomain: "mrphuc-51580.firebaseapp.com",
  databaseURL: "https://mrphuc-51580-default-rtdb.firebaseio.com",
  projectId: "mrphuc-51580",
  storageBucket: "mrphuc-51580.firebasestorage.app",
  messagingSenderId: "922607657180",
  appId: "1:922607657180:web:2d1f482bd5aa562214d419"
};
const IMG_KEY = "11fa26a3d2a300961577fa631bfc603c";
const DEF_U = "phuc", DEF_P = "phc51580";
const DB = "mrphuc_v2_final", SK = "mrphuc_session_v2";

const app = initializeApp(cfg);
const db = getDatabase(app);

const THEMES = [
  {id:'red',n:'Đỏ',m:'#ff2a2a',d:'#c00000',r:'255,42,42'},
  {id:'green',n:'Xanh lá',m:'#00c853',d:'#00a844',r:'0,200,83'},
  {id:'blue',n:'Xanh dương',m:'#0084ff',d:'#0060c0',r:'0,132,255'},
  {id:'purple',n:'Tím',m:'#a855f7',d:'#7c3aed',r:'168,85,247'},
  {id:'orange',n:'Cam',m:'#ff6b35',d:'#d94a1a',r:'255,107,53'},
  {id:'pink',n:'Hồng',m:'#ec4899',d:'#be185d',r:'236,72,153'},
  {id:'gold',n:'Vàng',m:'#ffd700',d:'#d4a900',r:'255,215,0'},
  {id:'cyan',n:'Xanh ngọc',m:'#06b6d4',d:'#0891b2',r:'6,182,212'}
];
const BG_COLORS = ['#000','#0a0e17','#131826','#1a0033','#001a33','#1a0000','#0a1a00','#2a1a00','#1a002a','#0f0f0f','#fff','#f0f0f0','#e0e8f0','#ffe0e0','#e0ffe0'];
const ICONS = [
  {e:'📘',c:'facebook'},{e:'💌',c:'messenger'},{e:'🎵',c:'tiktok'},
  {e:'💬',c:'zalo'},{e:'👥',c:'group'},{e:'✈️',c:'telegram'},
  {e:'🎮',c:'discord'},{e:'📧',c:'gmail'},{e:'▶️',c:'youtube'},
  {e:'📷',c:'instagram'},{e:'🐦',c:'twitter'},{e:'📞',c:'phone'},
  {e:'⭐',c:'custom'},{e:'🔗',c:'link'},{e:'🔥',c:'custom'},
  {e:'💎',c:'custom'},{e:'🎯',c:'custom'},{e:'🚀',c:'custom'}
];
const T_ICON = {facebook:'📘',messenger:'💌',tiktok:'🎵',zalo:'💬','zalo-group':'👥',telegram:'✈️',discord:'🎮',gmail:'📧',youtube:'▶️',instagram:'📷',twitter:'🐦',phone:'📞',custom:'⭐',link:'🔗'};

let S = {
  name:"Mr.Phuc",tagline:"★ HACKER - CRACKER ★",
  desc:"Chào bạn! Mình là Mr.Phuc — chuyên về các dịch vụ công nghệ, script, tool. Liên hệ mình qua các kênh bên dưới nhé!",
  logo:"",music:"",theme:"red",bgType:"stars",bgValue:"",
  bgSize:"cover",bgPosX:"center",bgPosY:"center",bgZoom:100,
  logoSize:130,logoPosX:50,logoPosY:50,
  voiceText:"",voiceRate:1,voicePitch:1,voiceGender:"female",voiceLoop:false,voiceEnabled:false,
  adminUser:"phuc",adminPass:"phc51580",links:[]
};
let cClick=0,cTimer=null,cTab='info',editId=null,selIcon='📘',selIconC='facebook';
let musicP=false,isAdmin=false,voices=[],selVoice=null,voiceSpeaking=false;

window.notif = (msg,err=false) => {
  const el = document.createElement('div');
  el.className = 'ntf' + (err?' err':'');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2500);
};
window.closeM = (id) => document.getElementById(id).classList.remove('show');

onValue(ref(db,DB+'/settings'), (snap) => {
  const d = snap.val();
  if (d) S = {...S,...d};
  applyTheme(S.theme||'red');
  applyBg();
  applyLogoStyle();
  render();
});

onValue(ref(db,DB+'/links'), (snap) => {
  const d = snap.val();
  if (d) S.links = Object.entries(d).map(([id,l])=>({id,...l})).sort((a,b)=>(a.order||0)-(b.order||0));
  else S.links = [];
  renderLinks();
  if (cTab==='link' && document.getElementById('adminMod').classList.contains('show')) renderTab();
});

function applyTheme(id){
  const t = THEMES.find(x=>x.id===id) || THEMES[0];
  const r = document.documentElement;
  r.style.setProperty('--m',t.m);
  r.style.setProperty('--md',t.d);
  r.style.setProperty('--ms',`rgba(${t.r},.15)`);
  r.style.setProperty('--mg',`rgba(${t.r},.5)`);
}

function applyBg(){
  const b = document.body;
  b.classList.remove('hide-stars');
  if (S.bgType==='image' && S.bgValue) {
    const sz = S.bgSize==='cover'?'cover':S.bgSize==='contain'?'contain':'auto';
    b.style.background = `url('${S.bgValue}')`;
    b.style.backgroundSize = sz;
    b.style.backgroundPosition = `${S.bgPosX} ${S.bgPosY}`;
    b.style.backgroundRepeat = 'no-repeat';
    b.style.backgroundAttachment = 'fixed';
    if (S.bgZoom !== 100 && S.bgSize !== 'contain') b.style.backgroundSize = `${S.bgZoom}%`;
    b.classList.add('hide-stars');
  } else if (S.bgType==='color' && S.bgValue) {
    b.style.background = S.bgValue;
    b.style.backgroundSize = '';
    b.style.backgroundPosition = '';
    b.style.backgroundAttachment = '';
    b.classList.add('hide-stars');
  } else {
    b.style.background = '#000';
    b.style.backgroundSize = '';
    b.style.backgroundPosition = '';
    b.style.backgroundAttachment = '';
  }
}

function applyLogoStyle(){
  document.documentElement.style.setProperty('--ls',(S.logoSize||130)+'px');
  const li = document.getElementById('logoImg');
  if (li) li.style.objectPosition = `${S.logoPosX||50}% ${S.logoPosY||50}%`;
}

function render(){
  document.getElementById('dName').textContent = S.name || 'Mr.Phuc';
  document.getElementById('dTag').textContent = S.tagline || '';
  document.getElementById('dDesc').textContent = S.desc || '';
  document.title = S.name || 'Mr.Phuc';
  const li = document.getElementById('logoImg');
  const lp = document.getElementById('logoPh');
  if (S.logo) { li.src = S.logo; li.style.display='block'; lp.style.display='none'; }
  else { li.style.display='none'; lp.style.display='flex'; lp.textContent = (S.name||'P').charAt(0).toUpperCase(); }
  applyLogoStyle();
}

function renderLinks(){
  const c = document.getElementById('linkC');
  if (!c) return;
  if (!S.links.length) { c.innerHTML=''; return; }
  c.innerHTML = S.links.map(l => {
    const ic = l.icon || T_ICON[l.type] || '🔗';
    const cls = l.iconColor ? getIconCls(l.iconColor) : getIconCls(l.type);
    return `<a class="lb" href="${l.url}" target="_blank"><div class="ic ${cls}">${ic}</div><div class="tx">${l.name}</div><div class="ar">›</div></a>`;
  }).join('');
}

function getIconCls(t){
  const map = {facebook:'ic-facebook',messenger:'ic-messenger',tiktok:'ic-tiktok',zalo:'ic-zalo',group:'ic-group',telegram:'ic-telegram',discord:'ic-discord',gmail:'ic-gmail',youtube:'ic-youtube',instagram:'ic-instagram',twitter:'ic-twitter',phone:'ic-phone',custom:'ic-custom',link:'ic-link'};
  return map[t] || 'ic-custom';
}

window.countClick = () => {
  cClick++;
  if (cTimer) clearTimeout(cTimer);
  cTimer = setTimeout(()=>{cClick=0;},1500);
  if (cClick >= 2) {
    cClick = 0;
    if (isAdmin) { window.openAdmin(); return; }
    document.getElementById('loginMod').classList.add('show');
    document.getElementById('aUser').value = '';
    document.getElementById('aPass').value = '';
  }
};

window.doLogin = () => {
  const u = document.getElementById('aUser').value.trim();
  const p = document.getElementById('aPass').value;
  const vu = S.adminUser || DEF_U;
  const vp = S.adminPass || DEF_P;
  if (u !== vu || p !== vp) return window.notif('Sai tên hoặc mật khẩu!',true);
  localStorage.setItem(SK,'1');
  isAdmin = true;
  closeM('loginMod');
  window.notif('👑 Chào Admin!');
  setTimeout(()=>window.openAdmin(),300);
};

window.logout = () => {
  localStorage.removeItem(SK);
  isAdmin = false;
  closeM('adminMod');
  stopVoice();
  window.notif('Đã đăng xuất');
};

window.openAdmin = () => {
  document.getElementById('adminMod').classList.add('show');
  showTab('info');
};

if (localStorage.getItem(SK)==='1') isAdmin = true;

window.showTab = (t) => {
  cTab = t;
  ['info','logo','color','bg','link','music','voice','acc'].forEach(x=>{
    const el = document.getElementById('tb'+x.charAt(0).toUpperCase()+x.slice(1));
    if (el) el.classList.toggle('active', x===t);
  });
  renderTab();
};

function renderTab(){
  const c = document.getElementById('tabC');
  if (cTab==='info') {
    c.innerHTML = `
      <input id="setName" placeholder="Tên hiển thị" value="${S.name||''}">
      <input id="setTag" placeholder="Tagline" value="${S.tagline||''}">
      <textarea id="setDesc" placeholder="Mô tả">${S.desc||''}</textarea>
      <button class="btn" onclick="saveInfo()">💾 Lưu</button>`;
  } else if (cTab==='logo') {
    c.innerHTML = `
      ${S.logo?`<img class="pv" src="${S.logo}">`:'<p style="text-align:center;color:#888;font-size:13px;margin-bottom:10px">Chưa có logo</p>'}
      <div class="ub" onclick="document.getElementById('logoFile').click()">📷 Chọn ảnh logo</div>
      <input type="file" id="logoFile" accept="image/*" style="display:none" onchange="upLogo(this)">
      <p style="text-align:center;color:#888;font-size:12px;margin:8px 0">Hoặc dán link:</p>
      <input id="logoUrl" placeholder="https://..." value="${S.logo||''}">
      <button class="btn" onclick="saveLogoUrl()">💾 Lưu link</button>
      <p style="color:var(--m);font-weight:700;margin:16px 0 8px;font-size:13px">🎨 Kích thước</p>
      <div class="sl"><span>Nhỏ</span><span id="lzv">${S.logoSize||130}px</span><span>To</span></div>
      <input type="range" min="80" max="200" value="${S.logoSize||130}" oninput="chgLogoSz(this.value)">

async function upImg(file){
  const fd = new FormData(); fd.append('image',file);
  const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMG_KEY}`,{method:'POST',body:fd});
  const d = await r.json();
  if (d.success) return d.data.url;
  throw new Error('Lỗi upload');
}

window.saveLink = async () => {
  const type = document.getElementById('lkType').value;
  const name = document.getElementById('lkName').value.trim();
  let url = document.getElementById('lkUrl').value.trim();
  if (!name || !url) return window.notif('Nhập đủ',true);
  const pc = url.replace(/[^0-9+]/g,'');
  const isP = /^[0-9+\s]+$/.test(url);
  if (type==='phone') { if (!url.startsWith('tel:')) url = 'tel:'+pc; }
  else if (type==='zalo'||type==='zalo-group') {
    if (url.startsWith('tel:')) url = url.replace('tel:','');
    if (isP || /^[0-9+\s]+$/.test(url)) url = 'https://zalo.me/'+url.replace(/\s/g,'');
    else if (!url.startsWith('http')) url = 'https://'+url;
  } else if (type==='gmail') {
    if (!url.startsWith('mailto:') && !url.startsWith('http')) url = 'mailto:'+url;
  } else {
    if (!url.startsWith('http') && !url.startsWith('mailto:') && !url.startsWith('tel:')) url = 'https://'+url;
  }
  const icon = selIcon || T_ICON[type] || '🔗';
  const iconColor = selIconC || type;
  if (editId) {
    await update(ref(db,DB+'/links/'+editId),{type,name,url,icon,iconColor});
    window.notif('✅ Đã sửa!');
  } else {
    await push(ref(db,DB+'/links'),{type,name,url,icon,iconColor,order:Date.now()});
    window.notif('✅ Đã thêm!');
  }
  closeM('linkMod');
  setTimeout(()=>renderTab(),400);
};

function pickVoice(){
  if (!voices.length) return;
  const g = S.voiceGender || 'female';
  const vi = voices.filter(v=>v.lang.includes('vi')||v.lang.includes('VI'));
  let p = null;
  if (g==='female') { p = vi.find(v=>/female|nữ|woman|linh|mai|vy/i.test(v.name)); if (!p) p = vi[0]; }
  else { p = vi.find(v=>/male|nam|man|hùng|dũng/i.test(v.name)); if (!p) p = vi[vi.length-1]||vi[0]; }
  selVoice = p || vi[0] || voices[0] || null;
}

  speak(t,false);
};

function speak(txt,isLoop){
  if (!('speechSynthesis' in window)) return window.notif('Không hỗ trợ!',true);
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'vi-VN';
  u.rate = S.voiceRate || 1;
  u.pitch = S.voicePitch || 1;
  if (selVoice) u.voice = selVoice;
  u.onstart = () => {
    voiceSpeaking = true;
    document.getElementById('musicBtn').textContent = '🗣️';
  };
  u.onend = () => {
    voiceSpeaking = false;
    if (isLoop && S.voiceLoop) setTimeout(()=>speak(txt,true),2000);
    else document.getElementById('musicBtn').textContent = '🔇';
  };
  speechSynthesis.speak(u);
}

window.stopVoice = () => {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  voiceSpeaking = false;
  document.getElementById('musicBtn').textContent = '🔇';
};

window.toggleMusic = () => {
  const btn = document.getElementById('musicBtn');
  if (S.voiceText && S.voiceEnabled) {
    if (voiceSpeaking) { stopVoice(); return; }
    speak(S.voiceText,S.voiceLoop);
    return;
  }
  if (!S.music) return window.notif('Chưa có nhạc!',true);
  if (musicP) {
    audio.pause(); musicP=false;
    btn.textContent='🔇'; btn.classList.remove('playing');
  } else {
    audio.src = S.music;
    audio.play().then(()=>{musicP=true;btn.textContent='🔊';}).catch(e=>window.notif('Lỗi nhạc: '+e.message,true));
  }
};

render();
renderIcons();
</script>
